spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medconnect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:medconnect-dev-secret-please-override-in-production-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# El JWT viaja en una cookie httpOnly (no en el body ni en localStorage).
# cookie-secure debe ser true en cualquier despliegue real (HTTPS) -- en
# local queda en false porque el dev server corre en http plano y una
# cookie Secure no se manda nunca por http, rompiendo el login.
app.cookie-secure=${COOKIE_SECURE:false}
# Origenes permitidos para CORS con credenciales (no puede ser "*" -- el
# navegador lo rechaza combinado con cookies). Patron por defecto para que
# ande sin tocar nada aunque Vite cambie de puerto en dev (5173, 5174...).
app.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
