spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medconnect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo maneja Flyway (db/migration/); Hibernate solo valida que las
# entidades coincidan con lo que Flyway ya creo, nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# baseline-version=1 hace que, en una base ya existente sin tabla de historial
# de Flyway (el caso del dev local, que ya tenia el esquema creado por
# ddl-auto=update), Flyway la marque como si V1 ya estuviera aplicada sin
# volver a ejecutarla. En una base nueva y vacia (CI, Docker) esto no aplica:
# Flyway simplemente corre V1 de punta a punta.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET:medconnect-dev-secret-please-override-in-production-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# El JWT viaja en una cookie httpOnly (no en el body ni en localStorage).
# cookie-secure debe ser true en cualquier despliegue real (HTTPS) -- en
# local queda en false porque el dev server corre en http plano y una
# cookie Secure no se manda nunca por http, rompiendo el login.
app.cookie-secure=${COOKIE_SECURE:false}
# Origenes permitidos para CORS con credenciales (no puede ser "*" -- el
# navegador lo rechaza combinado con cookies). Patron por defecto para que
# ande sin tocar nada aunque Vite cambie de puerto en dev (5173, 5174...).
app.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

# Solo /actuator/health queda expuesto (para liveness/readiness checks de un
# orquestador). show-details=never evita filtrar detalle de los health
# indicators (p.ej. la URL de la base) a quien pegue el endpoint sin
# autenticarse -- solo devuelve el status agregado UP/DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
